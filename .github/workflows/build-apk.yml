name: Build Signed APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"

      - name: Restore signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ERROR: ANDROID_KEYSTORE_BASE64 未设置"
            exit 1
          fi

          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode \
            > "$RUNNER_TEMP/floating-translator.jks"

          test -s "$RUNNER_TEMP/floating-translator.jks" || {
            echo "ERROR: 签名文件还原失败"
            exit 1
          }

          echo "Keystore restored successfully"

      - name: Build Signed Release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/floating-translator.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_PASSWORD" || {
            echo "ERROR: 缺少 ANDROID_KEYSTORE_PASSWORD"
            exit 1
          }

          test -n "$ANDROID_KEY_ALIAS" || {
            echo "ERROR: 缺少 ANDROID_KEY_ALIAS"
            exit 1
          }

          test -n "$ANDROID_KEY_PASSWORD" || {
            echo "ERROR: 缺少 ANDROID_KEY_PASSWORD"
            exit 1
          }

          gradle assembleRelease --stacktrace

      - name: Copy Release APK
        run: |
          test -f app/build/outputs/apk/release/app-release.apk || {
            echo "ERROR: 找不到 Release APK"
            find app/build/outputs -type f || true
            exit 1
          }

          cp \
            app/build/outputs/apk/release/app-release.apk \
            FloatingTranslator-v0.3.1-release.apk

      - name: Verify APK Signature
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" \
            -type f \
            -name apksigner \
            | sort -V \
            | tail -n 1)"

          test -n "$APKSIGNER" || {
            echo "ERROR: 找不到 apksigner"
            exit 1
          }

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            FloatingTranslator-v0.3.1-release.apk

      - name: Show APK information
        run: |
          ls -lh FloatingTranslator-v0.3.1-release.apk
          sha256sum FloatingTranslator-v0.3.1-release.apk

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: FloatingTranslator-v0.3.1-Signed
          path: FloatingTranslator-v0.3.1-release.apk
          if-no-files-found: error
          retention-days: 30

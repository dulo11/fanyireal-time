name: Build Signed APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"

      - name: Read app version
        run: |
          VERSION="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"/\1/p' app/build.gradle.kts | head -n 1)"
          if [ -z "$VERSION" ]; then
            echo "ERROR: 无法读取 versionName"
            exit 1
          fi
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$VERSION" >> "$GITHUB_ENV"
          echo "APK_NAME=FloatingTranslator-v${VERSION}-release.apk" >> "$GITHUB_ENV"
          echo "ARTIFACT_NAME=FloatingTranslator-v${VERSION}-Signed" >> "$GITHUB_ENV"

      - name: Restore signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ERROR: ANDROID_KEYSTORE_BASE64 未设置"
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/floating-translator.jks"
          test -s "$RUNNER_TEMP/floating-translator.jks" || exit 1

      - name: Build universal signed APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/floating-translator.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle clean assembleRelease --stacktrace

      - name: Copy universal APK
        run: |
          test -f app/build/outputs/apk/release/app-release.apk || exit 1
          cp app/build/outputs/apk/release/app-release.apk "$APK_NAME"
          cp "$APK_NAME" FloatingTranslator-latest.apk

      - name: Verify APK signature
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER" || exit 1
          "$APKSIGNER" verify --verbose --print-certs "$APK_NAME"

      - name: Show APK information
        run: |
          ls -lh "$APK_NAME"
          sha256sum "$APK_NAME"

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.APK_NAME }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$APK_NAME" FloatingTranslator-latest.apk --clobber
            gh release edit "$RELEASE_TAG" --title "FloatingTranslator $RELEASE_TAG" --latest
          else
            gh release create "$RELEASE_TAG" \
              "$APK_NAME" FloatingTranslator-latest.apk \
              --target "$GITHUB_SHA" \
              --title "FloatingTranslator $RELEASE_TAG" \
              --notes "浮译 $APP_VERSION 正式签名通用版。\n\n- 在线主力翻译确定为 百度 / Azure / 阿里云；自动模式仍然 ML Kit 离线优先\n- 新增阿里云机器翻译 AccessKey ID / Secret 配置与 ROA HMAC-SHA1 客户端签名\n- 阿里云使用 HTTPS 通用版翻译接口，不把 AccessKey 写进 APK\n- Azure 仅有 Subscription Key 时也可配置；Region 改为可选，多服务资源再填写\n- 自动云端兜底只尝试百度、Azure、阿里云，其他旧引擎仅保留手动兼容\n- API 页面优先展示百度、Azure、阿里云，并继续使用 Android Keystore + AES/GCM 保存密钥\n- 保留 v0.5.8 的 Silero VAD、快语速上下文、二次识别校正、热词和 ROOT 通话增强\n- 仅发布通用 APK，并通过 apksigner 签名校验\n\n长期下载入口：Releases → Latest" \
              --latest
          fi

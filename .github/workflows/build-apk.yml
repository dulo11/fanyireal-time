name: Build Signed APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # 把 GitHub Secret 中保存的 Base64 keystore 还原为真正的签名文件
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: ANDROID_KEYSTORE_BASE64 is empty"
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release-keystore.jks

          if [ ! -s release-keystore.jks ]; then
            echo "ERROR: Failed to restore release-keystore.jks"
            exit 1
          fi

          echo "Keystore restored successfully."

      # 构建正式 Release APK
      - name: Build Release APK
        run: ./gradlew assembleRelease

      # 自动寻找刚刚生成的 release APK
      - name: Find Release APK
        id: find_apk
        shell: bash
        run: |
          APK="$(find . \
            -path '*/build/outputs/apk/release/*.apk' \
            -type f \
            ! -name '*signed*' \
            ! -name '*aligned*' \
            | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK not found"
            find . -path '*build/outputs/apk*' -type f || true
            exit 1
          fi

          echo "Found APK: $APK"
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

      # 查找 Android SDK 自带的 zipalign 和 apksigner
      - name: Locate Android signing tools
        id: android_tools
        shell: bash
        run: |
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" \
            -type f -name zipalign | sort -V | tail -n 1)"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" \
            -type f -name apksigner | sort -V | tail -n 1)"

          if [ -z "$ZIPALIGN" ]; then
            echo "ERROR: zipalign not found"
            exit 1
          fi

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found"
            exit 1
          fi

          echo "zipalign=$ZIPALIGN" >> "$GITHUB_OUTPUT"
          echo "apksigner=$APKSIGNER" >> "$GITHUB_OUTPUT"

      # APK 对齐
      - name: Zipalign APK
        shell: bash
        run: |
          "${{ steps.android_tools.outputs.zipalign }}" \
            -f -p 4 \
            "${{ steps.find_apk.outputs.apk_path }}" \
            FloatingTranslator-release-aligned.apk

      # 用你自己的固定 keystore 正式签名
      - name: Sign Release APK
        env:
          KS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -z "$KS_PASSWORD" ]; then
            echo "ERROR: ANDROID_KEYSTORE_PASSWORD is empty"
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: ANDROID_KEY_ALIAS is empty"
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: ANDROID_KEY_PASSWORD is empty"
            exit 1
          fi

          "${{ steps.android_tools.outputs.apksigner }}" sign \
            --ks release-keystore.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KS_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out FloatingTranslator-release.apk \
            FloatingTranslator-release-aligned.apk

      # 验证 APK 确实已经签名
      - name: Verify APK Signature
        shell: bash
        run: |
          "${{ steps.android_tools.outputs.apksigner }}" \
            verify \
            --verbose \
            --print-certs \
            FloatingTranslator-release.apk

      # 输出 APK 信息
      - name: Show APK
        run: |
          echo "===== SIGNED APK ====="
          ls -lh FloatingTranslator-release.apk
          sha256sum FloatingTranslator-release.apk

      # 上传，成功后从 Actions 页面下载
      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: FloatingTranslator-Signed-Release
          path: FloatingTranslator-release.apk
          if-no-files-found: error
          retention-days: 30

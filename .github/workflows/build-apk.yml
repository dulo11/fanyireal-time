name: Build Signed APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/build-apk.yml"

concurrency:
  group: signed-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"

      - name: Read app version
        run: |
          VERSION="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"/\1/p' app/build.gradle.kts | head -n 1)"
          if [ -z "$VERSION" ]; then
            echo "ERROR: 无法读取 versionName"
            exit 1
          fi
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$VERSION" >> "$GITHUB_ENV"
          echo "APK_NAME=FloatingTranslator-v${VERSION}-release.apk" >> "$GITHUB_ENV"
          echo "ARTIFACT_NAME=FloatingTranslator-v${VERSION}-Signed" >> "$GITHUB_ENV"

      - name: Restore signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ERROR: ANDROID_KEYSTORE_BASE64 未设置"
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/floating-translator.jks"
          test -s "$RUNNER_TEMP/floating-translator.jks" || exit 1

      - name: Build universal signed APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/floating-translator.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle clean testDebugUnitTest lintRelease assembleRelease --stacktrace

      - name: Copy universal APK
        run: |
          test -f app/build/outputs/apk/release/app-release.apk || exit 1
          cp app/build/outputs/apk/release/app-release.apk "$APK_NAME"
          cp "$APK_NAME" FloatingTranslator-latest.apk

      - name: Verify APK signature
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER" || exit 1
          "$APKSIGNER" verify --verbose --print-certs "$APK_NAME"

      - name: Show APK information
        run: |
          ls -lh "$APK_NAME"
          sha256sum "$APK_NAME" FloatingTranslator-latest.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.APK_NAME }}
          if-no-files-found: error
          retention-days: 30

      - name: Verify signing continuity with dev5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/previous-release"
          gh release download v0.7.0-dev5 --pattern 'FloatingTranslator-v0.7.0-dev5-release.apk' --dir "$RUNNER_TEMP/previous-release"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --print-certs "$RUNNER_TEMP/previous-release/FloatingTranslator-v0.7.0-dev5-release.apk" > "$RUNNER_TEMP/previous-cert.txt"
          "$APKSIGNER" verify --print-certs "$APK_NAME" > "$RUNNER_TEMP/current-cert.txt"
          sed -n 's/.*certificate SHA-256 digest: //p' "$RUNNER_TEMP/previous-cert.txt" | sort -u > "$RUNNER_TEMP/previous-digest.txt"
          sed -n 's/.*certificate SHA-256 digest: //p' "$RUNNER_TEMP/current-cert.txt" | sort -u > "$RUNNER_TEMP/current-digest.txt"
          test -s "$RUNNER_TEMP/previous-digest.txt"
          test -s "$RUNNER_TEMP/current-digest.txt"
          diff "$RUNNER_TEMP/previous-digest.txt" "$RUNNER_TEMP/current-digest.txt"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -s RELEASE_NOTES.md
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists; use a new version instead of replacing published APKs."
            exit 1
          fi
          if [[ "$APP_VERSION" == *-* ]]; then
            gh release create "$RELEASE_TAG" "$APK_NAME" FloatingTranslator-latest.apk SHA256SUMS.txt \
              --target "$GITHUB_SHA" --title "FloatingTranslator $RELEASE_TAG" \
              --notes-file RELEASE_NOTES.md --prerelease --latest=false
          else
            gh release create "$RELEASE_TAG" "$APK_NAME" FloatingTranslator-latest.apk SHA256SUMS.txt \
              --target "$GITHUB_SHA" --title "FloatingTranslator $RELEASE_TAG" \
              --notes-file RELEASE_NOTES.md --latest
          fi

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-verification-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-release.*
          if-no-files-found: ignore

name: Build Signed APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"

      - name: Read app version
        run: |
          VERSION="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"/\1/p' app/build.gradle.kts | head -n 1)"
          if [ -z "$VERSION" ]; then
            echo "ERROR: 无法读取 versionName"
            exit 1
          fi
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$VERSION" >> "$GITHUB_ENV"
          echo "APK_NAME=FloatingTranslator-v${VERSION}-release.apk" >> "$GITHUB_ENV"
          echo "ARTIFACT_NAME=FloatingTranslator-v${VERSION}-Signed" >> "$GITHUB_ENV"

      - name: Restore signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ERROR: ANDROID_KEYSTORE_BASE64 未设置"
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/floating-translator.jks"
          test -s "$RUNNER_TEMP/floating-translator.jks" || exit 1

      - name: Build universal signed APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/floating-translator.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle clean assembleRelease --stacktrace

      - name: Copy universal APK
        run: |
          test -f app/build/outputs/apk/release/app-release.apk || exit 1
          cp app/build/outputs/apk/release/app-release.apk "$APK_NAME"
          cp "$APK_NAME" FloatingTranslator-latest.apk

      - name: Verify APK signature
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER" || exit 1
          "$APKSIGNER" verify --verbose --print-certs "$APK_NAME"

      - name: Show APK information
        run: |
          ls -lh "$APK_NAME"
          sha256sum "$APK_NAME"

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.APK_NAME }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="$(printf '%s\n' \
            "浮译 $APP_VERSION 固定签名测试版。" \
            "" \
            "- 新增全局固定底栏：首页 / 实时 / 全屏 / 模型 / 设置" \
            "- 新增一站式设置中心，常用功能不再逐层进入" \
            "- 新增应用界面语言切换，与翻译原语言/目标语言完全分开" \
            "- 首批界面语言：简繁中文、英语、日语、韩语、越南语、泰语、菲律宾语、马来语、印尼语、法语、德语、西语、葡语、俄语、阿拉伯语" \
            "- 支持 Android 13+ 应用独立语言设置与跟随系统" \
            "- 阿拉伯语启用 RTL 布局支持" \
            "- 翻译语言列表恢复为原有 ML Kit 59 种，不再把国家界面语言与翻译语种混在一起" \
            "- 保留无障碍全屏翻译、Azure 账号池、离线 ASR、ROOT/Shizuku 等现有功能" \
            "- 通用 APK 已通过 apksigner 固定签名校验" \
            "" \
            "稳定回滚：v0.6.0 Release 与 rollback-v0.6.0-stable 分支均已保留。")"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$APK_NAME" FloatingTranslator-latest.apk --clobber
            gh release edit "$RELEASE_TAG" --title "FloatingTranslator $RELEASE_TAG" --notes "$NOTES" --latest
          else
            gh release create "$RELEASE_TAG" \
              "$APK_NAME" FloatingTranslator-latest.apk \
              --target "$GITHUB_SHA" \
              --title "FloatingTranslator $RELEASE_TAG" \
              --notes "$NOTES" \
              --latest
          fi

name: Build v0.5.9 Rollback

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-rollback-059.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"
      - name: Restore clean v0.5.9 app source
        run: |
          rm -rf app
          git checkout v0.5.9 -- app
          sed -i 's/versionCode = 19/versionCode = 23/' app/build.gradle.kts
          sed -i 's/versionName = "0.5.9"/versionName = "0.5.9-rollback"/' app/build.gradle.kts
      - name: Restore signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/floating-translator.jks"
          test -s "$RUNNER_TEMP/floating-translator.jks"
      - name: Build signed rollback APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/floating-translator.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle clean assembleRelease --stacktrace
      - name: Verify and name APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk FloatingTranslator-v0.5.9-rollback.apk
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs FloatingTranslator-v0.5.9-rollback.apk
          sha256sum FloatingTranslator-v0.5.9-rollback.apk
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FloatingTranslator-v0.5.9-rollback
          path: FloatingTranslator-v0.5.9-rollback.apk
          retention-days: 30
      - name: Publish rollback release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.5.9-rollback >/dev/null 2>&1; then
            gh release upload v0.5.9-rollback FloatingTranslator-v0.5.9-rollback.apk --clobber
          else
            gh release create v0.5.9-rollback FloatingTranslator-v0.5.9-rollback.apk --target v0.5.9 --title "FloatingTranslator v0.5.9 Rollback" --notes "稳定回滚包：功能代码基于 v0.5.9，仅将 versionCode 提高到 23，并保持同一正式签名，便于从 v0.6.0-dev2/dev3 覆盖回滚。" --prerelease
          fi

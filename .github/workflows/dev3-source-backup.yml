name: Dev3 Source Backup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dev3-source-backup.yml"

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Archive clean dev3 source
        run: |
          CLEAN_SHA="7ea82984f6417e99d7d144fb459ada5ad5a7048d"
          git cat-file -e "$CLEAN_SHA^{commit}"
          git archive --format=zip --output=FloatingTranslator-v0.6.0-dev3-source.zip "$CLEAN_SHA"
          sha256sum FloatingTranslator-v0.6.0-dev3-source.zip
          ls -lh FloatingTranslator-v0.6.0-dev3-source.zip

      - name: Upload source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: FloatingTranslator-v0.6.0-dev3-source-backup
          path: FloatingTranslator-v0.6.0-dev3-source.zip
          if-no-files-found: error
          retention-days: 30

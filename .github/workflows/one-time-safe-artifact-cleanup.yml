name: One-time safe Actions artifact cleanup

on:
  push:
    paths:
      - ".github/workflows/one-time-safe-artifact-cleanup.yml"

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    if: github.event.head_commit.message == 'Run approved safe Actions artifact cleanup'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Remove older temporary artifacts, keep latest unmatched builds
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate --method GET \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            > "$RUNNER_TEMP/artifacts-jsonl"

          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          folder = Path(os.environ['RUNNER_TEMP'])
          records = []
          for line in (folder / 'artifacts-jsonl').read_text().splitlines():
              if line.strip():
                  records.extend(json.loads(line).get('artifacts', []))
          valid = [a for a in records if not a.get('expired', False)]
          valid.sort(key=lambda a: (a.get('created_at', ''), a['id']), reverse=True)
          keep = set()
          removed = []
          saved = []
          for artifact in valid:
              name = artifact['name']
              family = re.sub(r'-v[0-9]+(?:\.[0-9]+)*(?:[-._][a-zA-Z0-9]+)*', '', name, count=1)
              # Latest Android APK is already in this repo's Releases.
              release_backed_large_apk = (
                  os.environ['GITHUB_REPOSITORY'] == 'dulo11/fanyireal-time'
                  and name == 'FloatingTranslator-CI-signed'
              )
              if not release_backed_large_apk and family not in keep:
                  keep.add(family)
                  saved.append(artifact)
              else:
                  removed.append(artifact)
          (folder / 'delete-ids').write_text('\n'.join(str(a['id']) for a in removed) + '\n')
          print('Active artifact count:', len(valid))
          print('Preserved latest artifact families:', len(saved))
          print('Artifacts selected for deletion:', len(removed))
          print('Bytes to delete:', sum(a['size_in_bytes'] for a in removed))
          print('Preserving:', [(a['name'], a['size_in_bytes']) for a in saved])
          PY

          while IFS= read -r id; do
            [ -n "$id" ] || continue
            gh api --silent --method DELETE \
              "/repos/${GITHUB_REPOSITORY}/actions/artifacts/$id"
            echo "Deleted Actions artifact ID $id"
          done < "$RUNNER_TEMP/delete-ids"
          echo "Cleanup completed. Releases, Git history, tags and source remain unchanged."

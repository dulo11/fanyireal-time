name: Apply and Test Dev3

on:
  push:
    branches: [main]
    paths:
      - ".github/scripts/apply-dev3.py"
      - ".github/workflows/apply-dev3.yml"

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"

      - name: Apply dev3 source changes
        run: python3 .github/scripts/apply-dev3.py

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Commit tested app changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No app changes to commit"
          else
            git commit -m "Add fixed Shizuku PCM and enhanced microphone call mode"
            git push origin HEAD:main
          fi

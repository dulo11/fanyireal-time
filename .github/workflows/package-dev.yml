name: Package Dev APK and Source Backup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/package-dev.yml"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"

      - name: Read app version
        run: |
          VERSION="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"/\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$VERSION"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "APK_NAME=FloatingTranslator-v${VERSION}.apk" >> "$GITHUB_ENV"
          echo "SOURCE_NAME=FloatingTranslator-v${VERSION}-source.zip" >> "$GITHUB_ENV"
          echo "ARTIFACT_NAME=FloatingTranslator-v${VERSION}-backup" >> "$GITHUB_ENV"

      - name: Restore signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/floating-translator.jks"
          test -s "$RUNNER_TEMP/floating-translator.jks"

      - name: Build universal signed APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/floating-translator.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle clean assembleRelease --stacktrace

      - name: Verify and package files
        run: |
          test -f app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk "$APK_NAME"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK_NAME"
          git archive --format=zip --output="$SOURCE_NAME" HEAD
          ls -lh "$APK_NAME" "$SOURCE_NAME"
          sha256sum "$APK_NAME" "$SOURCE_NAME"

      - name: Upload APK and source backup
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            ${{ env.APK_NAME }}
            ${{ env.SOURCE_NAME }}
          if-no-files-found: error
          retention-days: 30

# retry-2

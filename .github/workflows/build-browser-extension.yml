name: Build Browser Extension

on:
  push:
    branches:
      - feature/browser-translator-v0.1
      - feature/browser-translator-v0.2
      - feature/browser-translator-v0.3
      - feature/browser-translator-v0.4
      - feature/browser-translator-v0.5-azure
      - feature/browser-translator-v0.6-userscript
    paths:
      - 'browser-extension/**'
      - 'userscript/**'
      - '.github/workflows/build-browser-extension.yml'
  pull_request:
    paths:
      - 'browser-extension/**'
      - 'userscript/**'
      - '.github/workflows/build-browser-extension.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-browser-extension:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate manifest and required files
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool browser-extension/manifest.json >/dev/null
          test -f browser-extension/background/service-worker.js
          test -f browser-extension/content/content.js
          test -f browser-extension/content/v02-enhancements.js
          test -f browser-extension/popup/popup.html
          test -f browser-extension/options/options.html
          test -f userscript/FloatingTranslator.user.js
          test -f userscript/README.md

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find browser-extension -type f -name '*.js' -print0)
          node --check userscript/FloatingTranslator.user.js

      - name: Validate UserScript metadata
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^// ==UserScript==$' userscript/FloatingTranslator.user.js
          grep -q '^// @version      0.6.0$' userscript/FloatingTranslator.user.js
          grep -q '^// @grant        GM_xmlhttpRequest$' userscript/FloatingTranslator.user.js
          grep -q '^// @connect      api.cognitive.microsofttranslator.com$' userscript/FloatingTranslator.user.js

      - name: Read extension version
        id: version
        shell: bash
        run: |
          VERSION=$(python - <<'PY'
          import json
          with open('browser-extension/manifest.json', encoding='utf-8') as f:
              print(json.load(f)['version'])
          PY
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Package extension
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cd browser-extension
          zip -r "../dist/FloatingTranslator-Browser-v${{ steps.version.outputs.version }}.zip" . \
            -x '*.DS_Store' \
            -x '*.git*'
          cd ..
          unzip -l "dist/FloatingTranslator-Browser-v${{ steps.version.outputs.version }}.zip"

      - name: Package UserScript
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/userscript
          cp userscript/FloatingTranslator.user.js "dist/userscript/FloatingTranslator-v${{ steps.version.outputs.version }}.user.js"
          cp userscript/README.md dist/userscript/README.md
          cd dist/userscript
          zip -r "../FloatingTranslator-UserScript-v${{ steps.version.outputs.version }}.zip" .
          cd ../..
          unzip -l "dist/FloatingTranslator-UserScript-v${{ steps.version.outputs.version }}.zip"

      - name: Upload extension ZIP
        uses: actions/upload-artifact@v4
        with:
          name: FloatingTranslator-Browser-v${{ steps.version.outputs.version }}
          path: dist/FloatingTranslator-Browser-v${{ steps.version.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload UserScript ZIP
        uses: actions/upload-artifact@v4
        with:
          name: FloatingTranslator-UserScript-v${{ steps.version.outputs.version }}
          path: |
            dist/FloatingTranslator-UserScript-v${{ steps.version.outputs.version }}.zip
            dist/userscript/FloatingTranslator-v${{ steps.version.outputs.version }}.user.js
          if-no-files-found: error
          retention-days: 30

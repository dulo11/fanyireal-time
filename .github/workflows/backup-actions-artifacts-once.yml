name: One-time move latest artifacts into Releases
on:
  push:
    paths:
      - '.github/workflows/backup-actions-artifacts-once.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify existing Release or publish the build and then clear Artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: artifact-backup-2026-10-17
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p raw staged verified
          expected_digest="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v0.7.3" --jq '.assets[] | select(.name=="FloatingTranslator-v0.7.3-release.apk") | .digest' | sed 's/^sha256://')"
          test -n "$expected_digest"
          echo "Existing v0.7.3 Release APK SHA256: $expected_digest"
          while IFS='|' read -r artifact_id artifact_name; do
            metadata="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id")"
            test "$(printf '%s' "$metadata" | jq -r .name)" = "$artifact_name"
            test "$(printf '%s' "$metadata" | jq -r .expired)" = false
            run_id="$(printf '%s' "$metadata" | jq -r .workflow_run.id)"
            test "$run_id" != null
            gh run download "$run_id" --name "$artifact_name" --dir "raw/$artifact_name"
            test -n "$(find "raw/$artifact_name" -type f -print -quit)"
            if [[ "$artifact_name" == *reports ]]; then
              (cd "raw/$artifact_name" && zip -qr "../../staged/$artifact_name.zip" .)
            else
              apk="$(find "raw/$artifact_name" -type f -name '*.apk' -print -quit)"
              test -n "$apk"
              sha="$(sha256sum "$apk" | cut -d ' ' -f1)"
              if [ "$sha" = "$expected_digest" ]; then
                echo "Already safely saved in published Releases: $artifact_name SHA256=$sha"
              else
                target="staged/$(basename "$apk")"
                test ! -e "$target"
                cp "$apk" "$target"
                echo "APK differs from existing published Release; staging independent backup: $target SHA256=$sha"
              fi
            fi
          done <<'ARTIFACTS'
          10541231836|FloatingTranslator-v0.7.3-Signed
          12073469410|FloatingTranslator-CI-signed
          10541341531|release-verification-reports
          12073643618|verification-reports
          ARTIFACTS
          if [ -n "$(find staged -type f -print -quit)" ]; then
            if ! gh release view "$TAG" >/dev/null 2>&1; then
              gh release create "$TAG" --title 'Build artifact reports and verified APK backup (2026-10-17)' --notes 'Backup of latest build artifacts not identical to the existing v0.7.3 Release; other artifacts are verified against the existing Release SHA256. Artifacts removed only after preservation.' --prerelease --latest=false --target main
            fi
            gh release upload "$TAG" staged/* --clobber
            for file in staged/*; do
              name="$(basename "$file")"
              gh release download "$TAG" --pattern "$name" --dir verified --clobber
              cmp -s "$file" "verified/$name" || { echo "RELEASE VALIDATION FAILURE: $name"; exit 1; }
              echo "Verified saved asset $name"
            done
          fi
          while IFS='|' read -r artifact_id artifact_name; do
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"
            echo "Deleted backed up artifact $artifact_id $artifact_name"
          done <<'ARTIFACTS'
          10541231836|FloatingTranslator-v0.7.3-Signed
          12073469410|FloatingTranslator-CI-signed
          10541341531|release-verification-reports
          12073643618|verification-reports
          ARTIFACTS
          echo 'Done: 4 artifacts preserved or matched with previously published Release'

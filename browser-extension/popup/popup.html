<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FloatingTranslator</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="panel">
    <header>
      <div>
        <h1>FloatingTranslator</h1>
        <p id="pageState">正在读取当前网页…</p>
      </div>
      <label class="switch" title="总开关">
        <input id="enabled" type="checkbox">
        <span></span>
      </label>
    </header>

    <section class="card">
      <label class="check-row">
        <input id="autoTranslate" type="checkbox">
        <span>自动持续翻译网页</span>
      </label>
      <label class="check-row">
        <input id="skipTargetLanguage" type="checkbox">
        <span>自动跳过已经是目标语言的文本</span>
      </label>

      <div class="grid">
        <label>
          <span>网页源语言</span>
          <select id="sourceLang"></select>
        </label>
        <label>
          <span>网页翻译为</span>
          <select id="targetLang"></select>
        </label>
      </div>

      <label>
        <span>显示方式</span>
        <select id="displayMode">
          <option value="translated">仅译文</option>
          <option value="bilingual">原文 + 译文</option>
        </select>
      </label>
      <div class="host">v0.9 会保护已经翻好的文字；网页脚本把译文覆盖回原文时会直接恢复，不重复调用翻译接口。</div>
    </section>

    <section class="card">
      <label class="check-row">
        <input id="chatMode" type="checkbox">
        <span>网页聊天连续翻译</span>
      </label>
      <label class="check-row">
        <input id="inputPreview" type="checkbox">
        <span>输入时实时预览译文</span>
      </label>
      <div class="grid">
        <label>
          <span>我输入的语言</span>
          <select id="inputSourceLang"></select>
        </label>
        <label>
          <span>我发送为</span>
          <select id="inputTargetLang"></select>
        </label>
      </div>
      <div class="actions">
        <button id="swapInputLang">交换输入语言</button>
      </div>
      <div class="host">输入预览里新增“仅复制译文 / 交换语言 / 本次输入暂停预览”。自动检测作为源语言时不能直接交换，先指定源语言即可。</div>
    </section>

    <section class="card">
      <label>
        <span>当前网站规则</span>
        <select id="siteRule">
          <option value="default">跟随全局设置</option>
          <option value="always">始终翻译此网站</option>
          <option value="never">永不翻译此网站</option>
        </select>
      </label>
      <div id="host" class="host"></div>
      <div id="exclusionCount" class="host">排除区域：正在读取…</div>
      <div class="actions">
        <button id="pickExclusion">选择不翻译区域</button>
        <button id="clearExclusions">清除此网站排除</button>
      </div>
      <div class="host">点“选择不翻译区域”后回到网页，再点要排除的区域。代码块、编辑器、用户名区等以后不会自动翻译；Esc 可取消选择。</div>
    </section>

    <div class="actions">
      <button id="pauseResume" class="primary">暂停翻译</button>
      <button id="translateNow">重新翻译整页</button>
      <button id="rescanPage">补扫遗漏内容</button>
      <button id="restorePage">恢复原文</button>
    </div>

    <div class="tip">暂停后会保留当前译文和剩余队列；继续时从剩余内容接着跑。术语表在高级设置中维护。</div>
    <button id="openOptions" class="link-button">翻译引擎、术语表、用量与缓存设置 ›</button>
  </main>
  <script src="popup.js"></script>
</body>
</html>

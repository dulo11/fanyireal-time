<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FloatingTranslator 设置</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main>
    <h1>FloatingTranslator Browser</h1>
    <p class="sub">完整翻译引擎与高级设置</p>

    <section>
      <h2>翻译引擎</h2>
      <label>
        <span>主引擎</span>
        <select id="provider">
          <option value="azure">Microsoft / Azure Translator（推荐）</option>
          <option value="google-web">Google Web（实验性，无 Key）</option>
        </select>
      </label>
      <label class="check-row">
        <input id="fallbackGoogle" type="checkbox">
        <span>Azure 失败时自动回退到 Google Web</span>
      </label>
      <p class="note">v0.7 以 Azure 为正式主引擎。连续失败会短暂熔断 Azure，避免长网页反复卡死；恢复后自动重试。</p>
    </section>

    <section id="azureSection">
      <h2>Microsoft / Azure Translator</h2>
      <label>
        <span>Endpoint</span>
        <input id="azureEndpoint" type="url" placeholder="https://api.cognitive.microsofttranslator.com">
      </label>
      <label>
        <span>Region</span>
        <input id="azureRegion" type="text" placeholder="例如 eastasia；按你的 Azure 资源填写">
      </label>
      <label>
        <span>Key</span>
        <input id="azureKey" type="password" autocomplete="off" placeholder="留空表示不修改已保存 Key">
      </label>
      <label class="check-row">
        <input id="clearAzureKey" type="checkbox">
        <span>清除本机已保存的 Key</span>
      </label>
      <label>
        <span>单次请求超时（毫秒）</span>
        <input id="requestTimeoutMs" type="number" min="3000" max="45000" step="1000" value="15000">
      </label>
      <label>
        <span>失败自动重试次数</span>
        <input id="maxRetries" type="number" min="0" max="5" step="1" value="3">
      </label>
      <p class="note">网页文本会自动去重、合批；429/5xx/超时会指数退避重试。超长文本会拆段后再合并。</p>
    </section>

    <section>
      <h2>行为</h2>
      <label class="check-row">
        <input id="enabled" type="checkbox">
        <span>启用扩展</span>
      </label>
      <label class="check-row">
        <input id="autoTranslate" type="checkbox">
        <span>打开网页后自动持续翻译</span>
      </label>
      <p class="note">长页面采用增量扫描，不再只翻译最前面几段；动态帖子、评论、聊天消息和 Open Shadow DOM 会继续跟进。</p>
    </section>

    <section>
      <h2>维护</h2>
      <div class="actions">
        <button id="testEngine">测试翻译引擎</button>
        <button id="refreshCacheStats">刷新缓存统计</button>
        <button id="clearCache">清空翻译缓存</button>
      </div>
      <p id="cacheStats" class="note">缓存统计：正在读取…</p>
      <p class="note">测试只翻译一条很短的测试文本。清缓存不会删除 Azure Key 或其他设置。</p>
    </section>

    <div class="actions">
      <button id="save" class="primary">保存设置</button>
      <span id="status"></span>
    </div>
  </main>
  <script src="options.js"></script>
</body>
</html>

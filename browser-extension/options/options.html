<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FloatingTranslator 设置</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main>
    <h1>FloatingTranslator Browser</h1>
    <p class="sub">翻译引擎与高级设置</p>

    <section>
      <h2>翻译引擎</h2>
      <label>
        <span>主引擎</span>
        <select id="provider">
          <option value="azure">Microsoft / Azure Translator（推荐）</option>
          <option value="google-web">Google Web（实验性，无 Key）</option>
        </select>
      </label>
      <label class="check-row">
        <input id="fallbackGoogle" type="checkbox">
        <span>Azure 失败时自动回退到 Google Web</span>
      </label>
      <p class="note">v0.5 起移除 Oracle OCI。默认优先 Azure；Google Web 只用于零配置测试或故障回退。</p>
    </section>

    <section id="azureSection">
      <h2>Microsoft / Azure Translator</h2>
      <label>
        <span>Endpoint</span>
        <input id="azureEndpoint" type="url" placeholder="https://api.cognitive.microsofttranslator.com">
      </label>
      <label>
        <span>Region</span>
        <input id="azureRegion" type="text" placeholder="例如 eastasia；按你的 Azure 资源填写">
      </label>
      <label>
        <span>Key</span>
        <input id="azureKey" type="password" autocomplete="off" placeholder="留空表示不修改已保存 Key">
      </label>
      <label class="check-row">
        <input id="clearAzureKey" type="checkbox">
        <span>清除本机已保存的 Key</span>
      </label>
      <p class="note">Key 只保存在当前浏览器的本地扩展存储，不写入 GitHub。v0.5 已把网页节点合并成批量 Azure 请求，减少大量小请求。</p>
    </section>

    <section>
      <h2>行为</h2>
      <label class="check-row">
        <input id="enabled" type="checkbox">
        <span>启用扩展</span>
      </label>
      <label class="check-row">
        <input id="autoTranslate" type="checkbox">
        <span>打开网页后自动持续翻译</span>
      </label>
      <p class="note">动态加载的新帖子、评论和聊天消息会自动加入翻译队列；相同文本优先读取本地缓存。</p>
    </section>

    <div class="actions">
      <button id="save" class="primary">保存设置</button>
      <span id="status"></span>
    </div>
  </main>
  <script src="options.js"></script>
</body>
</html>
